name: Notify author

on:
  workflow_call:
    inputs:
      content-path:
        type: string
        default: data/blog
      route-prefix:
        type: string
        default: /blog
      branch-prefix:
        type: string
        default: post-inbox/
      mail-from:
        type: string
        required: true
    secrets:
      RESEND_API_KEY:
        required: true
      AUTHOR_EMAIL_MAP:
        required: true

# The pull request lookup below uses the implicit `github.token`, which is fine
# — but the caller must grant `pull-requests: read` **on the job that calls this
# workflow**, not at the top level of its file. A top-level grant does not reach
# a `workflow_call` job, and the token then falls back to the repo default,
# which does not include pull requests. Passing the caller's GITHUB_TOKEN down
# as a secret does *not* work around a missing grant: it is the same token with
# the same permissions.

jobs:
  notify:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Find the post and its author
        id: post
        env:
          SHA: ${{ github.event.deployment.sha }}
          CONTENT_PATH: ${{ inputs.content-path }}
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="$(git branch -r --contains "$SHA" --format='%(refname:lstrip=3)' \
            | grep -v '^HEAD$' | head -1 || true)"
          echo "Branch for $SHA: ${branch:-unknown}"

          case "$branch" in
            "$BRANCH_PREFIX"*) ;;
            *)
              echo "Not a post-inbox branch; nothing to notify about."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          post="$(git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF:-main}...$SHA" -- "$CONTENT_PATH/*.mdx" | head -1)"
          if [ -z "$post" ]; then
            echo "No new post on this branch; nothing to notify about."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          author="$(sed -n "s/^authors: *\[['\"]\([^'\"]*\)['\"].*/\1/p" "$post" | head -1)"
          title="$(sed -n "s/^title: *['\"]\(.*\)['\"] *$/\1/p" "$post" | head -1)"
          slug="$(basename "$post" .mdx)"

          # `gh api` writes its error JSON to STDOUT and exits non-zero. An
          # earlier version used `|| true`, which swallowed the exit code and
          # left the JSON in `pr_url` — a non-empty string, so every downstream
          # emptiness check passed it through and the error body was emailed to
          # the author in place of the link. Check the exit code, then require
          # the value to actually look like a URL.
          pr_url=""
          if lookup="$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY%%/*}:$branch&state=all" \
            --jq '.[0].html_url // empty' 2>/dev/null)"; then
            case "$lookup" in
              https://*) pr_url="$lookup" ;;
              *) echo "PR lookup returned something that is not a URL; ignoring it" ;;
            esac
          else
            echo "PR lookup failed. Check the GITHUB_TOKEN Permissions group above:"
            echo "if PullRequests is absent, the calling job is missing"
            echo "'permissions: pull-requests: read' (it must be on the job, not"
            echo "at the top level of the caller's file)."
          fi
          echo "Pull request: ${pr_url:-not found}"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$post" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Post: $post (slug: $slug, author: ${author:-none})"

      # A called workflow does not bring its own repo's files along, so fetch the
      # shared scripts explicitly. `path` is repo-relative; `runner.temp` cannot
      # appear in a `with:` block, as that context does not exist at parse time.
      - name: Fetch the shared scripts
        if: steps.post.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/.github
          path: shared
          # The commit this workflow file itself was resolved from, so the script
          # cannot drift from the workflow that runs it. `ref: main` meant a
          # caller pinned to a tag still pulled the newest script, defeating the
          # point of pinning. `job_workflow_sha` is the *called* workflow's
          # commit; `workflow_sha` is the caller's, which does not exist here.
          ref: ${{ github.job_workflow_sha }}

      - name: Send the notification
        if: steps.post.outputs.found == 'true'
        env:
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTHOR_EMAIL_MAP: ${{ secrets.AUTHOR_EMAIL_MAP }}
          MAIL_FROM: ${{ inputs.mail-from }}
          AUTHOR: ${{ steps.post.outputs.author }}
          TITLE: ${{ steps.post.outputs.title }}
          POST_PATH: ${{ steps.post.outputs.path }}
          POST_SLUG: ${{ steps.post.outputs.slug }}
          ROUTE_PREFIX: ${{ inputs.route-prefix }}
          PR_URL: ${{ steps.post.outputs.pr_url }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          REF: ${{ github.event.deployment.sha }}
        run: |
          echo "Shared script pinned to: ${JOB_WORKFLOW_SHA:-<empty>}"
          test -f shared/.github/scripts/notify-author.mjs \
            || { echo "Shared script missing — the pinned ref did not resolve."; exit 1; }
          node shared/.github/scripts/notify-author.mjs
