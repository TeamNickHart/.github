name: Notify author

on:
  workflow_call:
    inputs:
      content-path:
        type: string
        default: data/blog
      route-prefix:
        type: string
        default: /blog
      branch-prefix:
        type: string
        default: post-inbox/
      mail-from:
        type: string
        required: true
    secrets:
      RESEND_API_KEY:
        required: true
      AUTHOR_EMAIL_MAP:
        required: true

jobs:
  notify:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      # BISECT 1 (baseline): re-establish in weishart-site the shape that loaded
      # in jennyweis-blog. No checkout, no other steps — one variable at a time.
      - name: Probe
        run: |
          echo "baseline loaded and ran"
          echo "env=${{ github.event.deployment.environment }}"
