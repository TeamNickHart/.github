name: Notify author

on:
  workflow_call:
    inputs:
      content-path:
        type: string
        default: data/blog
      route-prefix:
        type: string
        default: /blog
      branch-prefix:
        type: string
        default: post-inbox/
      mail-from:
        type: string
        required: true
    secrets:
      RESEND_API_KEY:
        required: true
      AUTHOR_EMAIL_MAP:
        required: true

jobs:
  notify:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      # BISECT 2: the first checkout, and nothing else changed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      # BISECT 3: the post-finding step — brings GH_TOKEN, a gh api call, and the
      # shell script. Nothing else changed.
      - name: Find the post and its author
        id: post
        env:
          SHA: ${{ github.event.deployment.sha }}
          CONTENT_PATH: ${{ inputs.content-path }}
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="$(git branch -r --contains "$SHA" --format='%(refname:lstrip=3)' \
            | grep -v '^HEAD$' | head -1 || true)"
          echo "Branch for $SHA: ${branch:-unknown}"

          case "$branch" in
            "$BRANCH_PREFIX"*) ;;
            *)
              echo "Not a post-inbox branch; nothing to notify about."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          post="$(git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF:-main}...$SHA" -- "$CONTENT_PATH/*.mdx" | head -1)"
          if [ -z "$post" ]; then
            echo "No new post on this branch; nothing to notify about."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          author="$(sed -n "s/^authors: *\[['\"]\([^'\"]*\)['\"].*/\1/p" "$post" | head -1)"
          title="$(sed -n "s/^title: *['\"]\(.*\)['\"] *$/\1/p" "$post" | head -1)"
          slug="$(basename "$post" .mdx)"

          # `gh api` writes its error JSON to STDOUT and exits non-zero. An
          # earlier version used `|| true`, which swallowed the exit code and
          # left the JSON in `pr_url` — a non-empty string, so every downstream
          # emptiness check passed it through and the error body was emailed to
          # the author in place of the link. Check the exit code, then require
          # the value to actually look like a URL.
          pr_url=""
          if lookup="$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY%%/*}:$branch&state=all" \
            --jq '.[0].html_url // empty' 2>/dev/null)"; then
            case "$lookup" in
              https://*) pr_url="$lookup" ;;
              *) echo "PR lookup returned something that is not a URL; ignoring it" ;;
            esac
          else
            echo "PR lookup failed (often a missing pull-requests: read permission)"
          fi
          echo "Pull request: ${pr_url:-not found}"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$post" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Post: $post (slug: $slug, author: ${author:-none})"

      # BISECT 4: the second checkout — the step that exists only because this is
      # a reusable workflow, since a called workflow does not bring its own
      # repo's files along. `path` is repo-relative; `runner.temp` cannot appear
      # in a `with:` block because that context does not exist at parse time.
      - name: Fetch the shared scripts
        if: steps.post.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/.github
          path: shared
          ref: main

      # BISECT 5: the send step — the last candidate, and the cause by
      # elimination since cycles 1-4 all loaded.
      - name: Send the notification
        if: steps.post.outputs.found == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTHOR_EMAIL_MAP: ${{ secrets.AUTHOR_EMAIL_MAP }}
          MAIL_FROM: ${{ inputs.mail-from }}
          AUTHOR: ${{ steps.post.outputs.author }}
          TITLE: ${{ steps.post.outputs.title }}
          POST_PATH: ${{ steps.post.outputs.path }}
          POST_SLUG: ${{ steps.post.outputs.slug }}
          ROUTE_PREFIX: ${{ inputs.route-prefix }}
          PR_URL: ${{ steps.post.outputs.pr_url }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          REF: ${{ github.event.deployment.sha }}
        run: node shared/.github/scripts/notify-author.mjs
