name: Notify author

on:
  workflow_call:
    inputs:
      content-path:
        type: string
        default: data/blog
      route-prefix:
        type: string
        default: /blog
      branch-prefix:
        type: string
        default: post-inbox/
      mail-from:
        type: string
        required: true
    secrets:
      RESEND_API_KEY:
        required: true
      AUTHOR_EMAIL_MAP:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Bisect probe
        run: |
          echo "loaded and ran"
          echo "mail-from present: ${{ inputs.mail-from != '' }}"
          echo "event: ${{ github.event_name }}"
          echo "deployment state: ${{ github.event.deployment_status.state }}"
          echo "environment: ${{ github.event.deployment.environment }}"
