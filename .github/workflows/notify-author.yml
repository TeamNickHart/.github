name: Notify author

on:
  workflow_call:
    inputs:
      content-path:
        type: string
        default: data/blog
      route-prefix:
        type: string
        default: /blog
      branch-prefix:
        type: string
        default: post-inbox/
      mail-from:
        type: string
        required: true
    secrets:
      RESEND_API_KEY:
        required: true
      AUTHOR_EMAIL_MAP:
        required: true

jobs:
  notify:
    # BISECT STEP: the only thing added back over the probe that loaded cleanly.
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Bisect probe with the if clause
        run: echo "loaded and ran with the if clause"
